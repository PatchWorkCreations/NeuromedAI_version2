{% load static %}{% if recaptcha_site_key %}
<input type="hidden" name="g-recaptcha-response" value="" data-recaptcha-action="{{ action }}" data-site-key="{{ recaptcha_site_key }}">
<p class="recaptcha-note">
  This site is protected by reCAPTCHA and the Google
  <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">Privacy Policy</a> and
  <a href="https://policies.google.com/terms" target="_blank" rel="noopener">Terms of Service</a> apply.
</p>
<script src="https://www.google.com/recaptcha/api.js?render={{ recaptcha_site_key|urlencode }}" async defer></script>
<script src="{% static 'js/recaptcha.js' %}" defer></script>
{% endif %}
