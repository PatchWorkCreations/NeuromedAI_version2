{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Aira — understand your visit{% endblock %}</title>
  <meta name="description" content="Aira helps you and your family understand, remember, and act on what happened at the doctor.">
  <link rel="icon" type="image/png" href="{% static 'img/aira-wordmark.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/aira.css' %}">
  <link rel="stylesheet" href="{% static 'css/shell.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body>
  {% include "includes/header.html" %}
  <main id="main">
    {% block content %}{% endblock %}
  </main>
  {% include "includes/footer.html" %}
  <script src="{% static 'js/shell.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
