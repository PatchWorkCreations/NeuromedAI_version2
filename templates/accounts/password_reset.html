{% extends "accounts/auth_base.html" %}
{% block title %}Reset password – NeuroMed Aira{% endblock %}
{% block form %}
  <header class="form-header">
    <h1>Forgot your password?</h1>
    <p>Enter the email on your account. We’ll send a reset link if it exists.</p>
  </header>
  <form method="post">
    {% csrf_token %}
    <div class="fields-grid">
      <div class="input-group full">
        <label for="{{ form.email.id_for_label }}">Email address</label>
        <div class="input-row">{{ form.email }}</div>
      </div>
    </div>
    <button type="submit" class="btn-submit">Send reset link</button>
  </form>
  <p class="login-row"><a href="{% url 'accounts:login' %}">Back to log in</a></p>
{% endblock %}
